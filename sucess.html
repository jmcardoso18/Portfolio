<!DOCTYPE html>
<html lang="pt-br">

<head>

    <!-- Servidores de Fontes do Google -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Fonte do Google - Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!--Meta tags essenciais-->
    <meta name="author" content="Jamila Moraes Cardoso">
    <meta name="description"
        content="Portfólio de Jamila M. Cardoso — Desenvolvedora Full Stack.Especialista em criar soluções digitais modernas, intuitivas e de alto desempenho. Explore meus projetos e entre em contato para construirmos algo incrível juntos.">
    <meta name="robots" content="index, follow">

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml"
        href="https://ik.imagekit.io/u0isfvxls/portf%C3%B3lio/favicon.svg?updatedAt=1762763667006">

    <!-- Devicon (ícones de linguagens e ferramentas) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css">

    <!-- Font Awesome (ícones adicionais) -->
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>

    <!-- Swiper.js -->
    <link rel="stylesheet" href="https://unpkg.com/swiper/swiper-bundle.min.css">

    <!-- Link para o arquivo CSS-->
    <link rel="stylesheet" href="./assets/css/style.css">


    <title>Portfólio da Mila</title>
</head>

<body>
    <!-- O elemento onde o efeito vai ser aplicado -->
    <div id="vanta-bg"></div>
    <!--Navbar - Menu-->
    <header class="flex menu_container">
        <article class="menu_content">
            <div id="titulo">
                <a href="index.html">❤️ Portfólio da Mila ❤️ </a>
            </div>
            <nav>
                <ul class="flex menu_list">
                    <li><a href="index.html#hero">Início</a></li>
                    <li><a href="index.html#about">Sobre</a></li>
                    <li><a href="index.html#habilidades">Habilidades</a></li>
                    <li><a href="index.html#projetos">Projetos</a></li>
                    <li><a href="index.html#contact">Contato</a></li>
                </ul>
            </nav>
        </article>
    </header>

    <!--Área Principal do Site-->
    <main>

        <section id="sucess" class="sucess_container">

            <article class="sucess_content" style="text-align: center;">
                <figure class="sucess_image">
                    <img src="assets/img/sucess.svg"
                        alt="Imagem de ok sinalizando que o envio do formulário foi realizado com sucesso"
                        class="float-animation">
                </figure>
                <h1>E-mail enviado com sucesso!</h1>
                <p> Obrigada por entrar em contato!!</p>
                <p>Logo mais retornarei a sua mensagem</p>

                <a onclick="history.back()" class="botao">Voltar</a>
            </article>
        </section>

    </main>

    <!--Rodapé-->
    <footer>
        Feito com ❤️ por Jamila Moraes Cardoso - 2025
    </footer>
    <!-- Colocando uma musica do ano que nasci -->
    <audio id="background-audio" loop autoplay controls style="display: none;">
        <source src="./assets/audio/musica_fundo.mp3" type="audio/mpeg">
        Seu navegador não suporta o elemento de áudio.
    </audio>
    <!-- Swiper e scripts -->
    <script src="https://unpkg.com/swiper/swiper-bundle.min.js"></script>
    <!-- Incluindo as bibliotecas necessárias -->
    <script src="https://unpkg.com/swiper/swiper-bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.birds.min.js"></script>
    <script>
        VANTA.BIRDS({
            el: "#vanta-bg",
            mouseControls: true,
            touchControls: true,
            gyroControls: false,
            minHeight: 200.00,
            minWidth: 200.00,
            scale: 1.00,
            scaleMobile: 1.00,
            backgroundColor: 0xfaced8,
            colorMode: "variance",
            birdSize: 4.00,
            wingSpan: 40.00,
            speedLimit: 10.00,
            separation: 100.00,
            alignment: 100.00,
            cohesion: 100.00
        })

    </script>
    <!-- Link para o arquivo JavaScript-->
    <script src="./assets/js/scripts.js"></script>
</body>

</html>
